apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app-deployment
  labels:
    app: java

spec:
  replicas: 6
  minReadySeconds: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0

  selector:
    matchLabels:
      app: java

  template:
    metadata:
      labels:
        app: java

    spec:
      containers:
      - name: java
        image: 075237969143.dkr.ecr.us-east-1.amazonaws.com/java-application:25
        
        ports:
        - containerPort: 8080
       

---
apiVersion: v1
kind: Service
metadata:
  name: java-app-service
spec:
  type: LoadBalancer
  selector:
    app: java
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
